<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xparty · Mobile preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0911;color:#eee;font:14px system-ui}header{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:14px}label{display:flex;align-items:center;gap:8px}select,button,a{background:#30243c;border:1px solid #54425f;border-radius:20px;color:white;padding:8px 14px;font:inherit;text-decoration:none}main{display:flex;justify-content:center;padding:0 12px 20px;overflow:auto}iframe{width:390px;height:844px;max-width:100%;flex:none;border:1px solid #59456c;border-radius:16px;background:#100d19}p{margin:0;color:#c8bdcf;font-size:12px}</style>
<header><strong>Xparty mobile preview</strong><label>Screen<select id="size"><option value="390,844">390 × 844</option value="320,740">320 × 740</option><option value="430,932">430 × 932</option><option value="844,390">844 × 390 · landscape</option></select></label><button id="refresh">Refresh</button><a href="/xparty/index.html" target="_blank" rel="noopener">Open full app</a><p>Create or join a room to see the watch layout.</p></header>
<main><iframe id="phone" title="Xparty mobile screen" src="/xparty/index.html?v=blueprint-20261025" allow="camera; microphone; autoplay; fullscreen; clipboard-write" allowfullscreen></iframe></main>
<script>const phone=document.getElementById('phone');document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split(',');phone.style.width=w+'px';phone.style.height=h+'px';};document.getElementById('refresh').onclick=()=>phone.contentWindow.location.reload();</script></html>
